name: Publish

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '55 1 * * 2'
  workflow_dispatch:

env:
    REGISTRY_USER: ${{ github.actor }}
    REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

jobs:

  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

    - name: Build the Docker image
      run: docker image build -f Containerfile --tag ghcr.io/containerpak/cpak-test:main .

    - name: Push To GHCR
      run: |
        docker login ghcr.io -u ${{ env.REGISTRY_USER }} -p ${{ env.REGISTRY_PASSWORD }}
        docker image push "ghcr.io/containerpak/cpak-test:main"

    - name: Pin published image
      run: |
        repository="$(jq -r '.image | split("@")[0]' cpak.json)"
        digest="$(docker manifest inspect --verbose "${repository}:main" | jq -r '.Descriptor.digest')"
        jq --arg image "${repository}@${digest}" '.image = $image' cpak.json > cpak.json.next
        mv cpak.json.next cpak.json
        if ! git diff --quiet -- cpak.json; then
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cpak.json
          git commit -m "chore: pin published image [skip ci]"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
        fi
